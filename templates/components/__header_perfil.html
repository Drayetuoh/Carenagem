    <div class="card_login">
        
        {% if user.is_authenticated %}
            <!-- ================= BLOCO: USUÁRIO LOGADO ================= -->
            <div class="perfil_header">
                <!-- Se não houver foto, cai para um placeholder padrão via Django -->
                <img src="{{ user.perfil.foto.url|default:'/static/img/default_avatar.jpg' }}" alt="Avatar" class="avatar_circle">
                <!-- Puxa apenas os dois primeiros nomes -->
                <span class="user_name">{{ user.first_name }} {{ user.last_name }}</span>
            </div>
            
            <hr>
            
            <nav class="perfil_nav">
                <a href="#">Editar Perfil</a>
                <a href="#">Alterar Senha</a>
                <a href="#">Alterar Foto</a>
                <a href="#">Minhas Postagens</a>
            </nav>
            
            <div class="perfil_actions">
                <button class="btn_outline">Trocar Conta</button>
                <form action="#" method="POST" style="width: 100%;">
                    {% csrf_token %}
                    <button type="submit" class="btn_danger">Deslogar</button>
                </form>
            </div>

        {% else %}
            <!-- ================= BLOCO: CONVIDADO (DESLOGADO) ================= -->
            <div class="perfil_header">
                <div class="avatar_circle avatar_generico">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <span class="user_name">Convidado</span>
            </div>
            
            <hr>
            
            <span class="card_title">Efetuar Login</span>
            
            <form class="login_form" action="#" method="POST">
                {% csrf_token %}
                <label>
                    <input type="text" name="username" placeholder="Usuário" required>
                </label>
                <label>
                    <input type="password" name="password" placeholder="Senha" required>
                </label>
                
                <div class="login_actions">
                    <button>Recuperar senha</button>
                    <button type="submit" class="btn_primary">Entrar</button>
                </div>
            </form>
            
            <hr>
            
            <span class="card_title">Outras formas de entrar</span>
            
            <div class="social_login">
                <a href="#" class="circle_btn google" title="Google">G</a>
                <a href="#" class="circle_btn instagram" title="Instagram">I</a>
                <a href="#" class="circle_btn twitter" title="Twitter">T</a>
                <a href="#" class="circle_btn facebook" title="Facebook">F</a>
            </div>
        {% endif %}
        
    </div>
</div>
